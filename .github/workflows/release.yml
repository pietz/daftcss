name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag to publish, for example vx.y.z"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Validate generated CSS and documentation
        run: npm run check

      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser and accessibility tests
        run: npm test

      - name: Read package version
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        run: |
          release_ref="${{ github.event.inputs.ref || github.ref_name }}"
          release_ref="${release_ref#refs/tags/}"
          if [[ "$release_ref" != "v${{ steps.pkg.outputs.version }}" ]]; then
            echo "Release ref $release_ref does not match package version v${{ steps.pkg.outputs.version }}."
            exit 1
          fi

      - name: Check npm version
        id: npm
        run: |
          if npm view "daftcss@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance

      - name: Skip existing package
        if: steps.npm.outputs.published == 'true'
        run: echo "daftcss@${{ steps.pkg.outputs.version }} is already published; skipping npm publish."
